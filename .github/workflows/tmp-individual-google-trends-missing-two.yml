name: Temporary individual Google Trends missing two

on:
  push:
    branches: ['tmp/individual-google-trends-missing-two']
    paths: ['.github/workflows/tmp-individual-google-trends-missing-two.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/individual-google-trends-missing-two
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install 'trendspyg[all]'
      - name: Fetch terms independently
        run: |
          cat > /tmp/fetch.py <<'PY'
          import csv, json, random, time
          from datetime import datetime, timezone
          from pathlib import Path
          from trendspyg import download_google_trends_interest_over_time

          terms = ['pave the cow path', 'source of truth']
          out = Path('tmp_google_trends')
          out.mkdir(exist_ok=True)
          rows = []
          statuses = []
          for term in terms:
              points = None
              error = ''
              for attempt in range(1, 7):
                  try:
                      payload = download_google_trends_interest_over_time(
                          term, geo='', timeframe='2018-01-01 2026-08-13',
                          category=5, headless=True, output_format='dict',
                          max_retries=6, retry_wait=9.0, cache=False,
                          archive=False, gprop=''
                      )
                      raw = payload.get('interest_over_time', payload) if isinstance(payload, dict) else payload
                      points = [
                          {'date': str(p['date']), 'term': term, 'search_interest': int(round(float(p['value'])))}
                          for p in raw if isinstance(p, dict) and 'date' in p and 'value' in p
                      ]
                      if len(points) < 100:
                          raise RuntimeError(f'unexpected point count: {len(points)}')
                      break
                  except Exception as exc:
                      error = f'{type(exc).__name__}: {exc}'
                      if attempt < 6:
                          time.sleep(20 * attempt + random.uniform(5, 12))
              if points:
                  rows.extend(points)
                  statuses.append({'term': term, 'status': 'ok', 'points': len(points), 'error': ''})
              else:
                  statuses.append({'term': term, 'status': 'error', 'points': 0, 'error': error})
          rows.sort(key=lambda r: (r['term'], r['date']))
          with (out / 'missing_two_direct.csv').open('w', encoding='utf-8-sig', newline='') as f:
              w = csv.DictWriter(f, fieldnames=['date','term','search_interest'])
              w.writeheader(); w.writerows(rows)
          (out / 'status.json').write_text(json.dumps({'fetched_at_utc': datetime.now(timezone.utc).isoformat(), 'statuses': statuses}, ensure_ascii=False, indent=2), encoding='utf-8')
          if any(s['status'] != 'ok' for s in statuses):
              raise SystemExit(1)
          PY
          python /tmp/fetch.py
      - name: Commit data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp_google_trends
          git commit -m 'Add temporary individual Google Trends data [skip ci]'
          git push origin HEAD:tmp/individual-google-trends-missing-two
